<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentasi Background Only</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

/* layar utama */
#stage{
    width:100vw;
    height:100vh;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transition:1s ease-in-out;
    position:relative;
}

/* navbar bawah */
.navbar{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    z-index:100;
    background:rgba(0,0,0,.45);
    padding:14px 18px;
    border-radius:60px;
    backdrop-filter:blur(8px);
}

button,a.back{
    border:none;
    padding:12px 18px;
    border-radius:40px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:.3s;
    color:white;
    text-decoration:none;
}

button:hover,a.back:hover{
    transform:scale(1.06);
}

.prev{background:#3498db;}
.next{background:#2ecc71;}
.pause{background:#f39c12;}
.stop{background:#e74c3c;}
.full{background:#9b59b6;}
.play{background:#16a085;}
.back{background:#c0392b;}

/* indikator scene */
.counter{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(0,0,0,.45);
    color:white;
    padding:10px 16px;
    border-radius:30px;
    font-weight:bold;
    z-index:100;
    backdrop-filter:blur(8px);
}

/* tombol awal play */
.start-box{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:200;
    background:rgba(0,0,0,.45);
}

.start-btn{
    background:#2ecc71;
    color:white;
    border:none;
    padding:18px 34px;
    font-size:22px;
    font-weight:bold;
    border-radius:60px;
    cursor:pointer;
}

.start-btn:hover{
    transform:scale(1.08);
}

@media(max-width:768px){

.navbar{
    width:95%;
    bottom:10px;
    padding:10px;
    gap:8px;
}

button,a.back{
    padding:10px 14px;
    font-size:13px;
}
}
</style>
</head>
<body>

<div id="stage"></div>

<div class="counter" id="counter">Scene 1 / 6</div>

<!-- tombol play awal -->
<div class="start-box" id="startBox">
<button class="start-btn" onclick="startStory()">▶ Mulai Cerita</button>
</div>

<div class="navbar">
<button class="prev" onclick="prevScene()">⏮ Prev</button>
<button class="pause" onclick="togglePause()">⏸ Pause</button>
<button class="next" onclick="nextScene()">▶ Next</button>
<button class="stop" onclick="stopMusic()">⏹ Stop</button>
<button class="full" onclick="fullscreen()">⛶ Full</button>
<a href="../index.html" class="back">⬅ Back</a>
</div>

<audio id="audio"></audio>

<script>
const scenes = [
{bg:"../assets/bg/1.png", audio:"../assets/hujan.mp3"},
{bg:"../assets/bg/2.png", audio:"../assets/sekolah.mp3"},
{bg:"../assets/bg/3.png", audio:"../assets/hening.mp3"},
{bg:"../assets/bg/4.png", audio:"../assets/semangat.mp3"},
{bg:"../assets/bg/5.png", audio:"../assets/ceria.mp3"},
{bg:"../assets/bg/6.png", audio:"../assets/penutup.mp3"}
];

let index = 0;
let started = false;

const stage = document.getElementById("stage");
const audio = document.getElementById("audio");
const counter = document.getElementById("counter");
const startBox = document.getElementById("startBox");

function showScene(i, play=true){

if(i < 0 || i >= scenes.length) return;

index = i;

stage.style.backgroundImage = `url('${scenes[i].bg}')`;
counter.innerHTML = `Scene ${i+1} / ${scenes.length}`;

audio.pause();
audio.currentTime = 0;
audio.src = scenes[i].audio;

if(play){
audio.play();
}
}

function startStory(){
started = true;
startBox.style.display = "none";
showScene(0,true);
}

function nextScene(){
if(index < scenes.length-1){
showScene(index+1,true);
}
}

function prevScene(){
if(index > 0){
showScene(index-1,true);
}
}

function togglePause(){
if(audio.paused){
audio.play();
}else{
audio.pause();
}
}

function stopMusic(){
audio.pause();
audio.currentTime = 0;
}

function fullscreen(){
document.documentElement.requestFullscreen();
}

/* keyboard */
document.addEventListener("keydown",function(e){

if(!started && e.key==="Enter"){
startStory();
}

if(e.key==="ArrowRight") nextScene();
if(e.key==="ArrowLeft") prevScene();
if(e.key===" ") togglePause();

});

/* tampil bg awal tanpa audio */
showScene(0,false);
</script>

</body>
</html>
