<!DOCTYPE html>

<head>

<title>Media Pembelajaran PGSD</title>

<style>
*{

    padding:0;
    box-sizing:border-box;

}

body{

    display:flex;

}

.container{

}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu a{
    text-decoration:none;
}

.menu button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    color:white;
}

.btn1{ background:#ff6b6b; }
.btn2{ background:#4ecdc4; }
.btn3{ background:#556270; }

.menu button:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 15px rgba(0,0,0,0.15);
}

.footer{

    font-size:14px;
    color:#888;
